<!doctype html>
<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ölüm Adası Poveglia — Hüseyn</title>
<meta name="description" content="Ölüm Adası Poveglia — Hüseynin orta əsr vəba romanı. Qara Ölümün kölgəsində bir hekayə.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;600;700;800&family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=MedievalSharp&display=swap" rel="stylesheet">

<style>
:root {
  --bg-deep: #080907;
  --charcoal-900: #0d100d;
  --charcoal-800: #131713;
  --charcoal-700: #1b201b;
  --olive-night: #151b14;
  --olive-deep: #1e261d;
  --olive-muted: #2e3b2c;
  --olive-accent: #495a43;
  --olive-glow: #384934;
  --parchment-base: #d8cdb8;
  --parchment-bright: #ede3ce;
  --parchment-dim: #b5a993;
  --parchment-shadow: #877c68;
  --parchment-faded: #625c50;
  --blood-dark: #581616;
  --blood-ember: #7d2424;
  --line-tomb: #282f26;
  --line-highlight: #3b4538;
  --shadow-fog: 0 20px 45px rgba(0,0,0,0.85);
}

* { box-sizing: border-box; }

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background-color: var(--bg-deep);
  color: var(--parchment-base);
  font-family: "EB Garamond", Garamond, "Times New Roman", serif;
  font-size: 20px;
  line-height: 1.8;
  position: relative;
  overflow-x: hidden;
  background-image:
    radial-gradient(ellipse 90% 60% at 50% 0%, rgba(30,38,29,.45) 0%, transparent 70%),
    radial-gradient(circle 800px at 20% 40%, rgba(22,28,21,.35) 0%, transparent 60%),
    radial-gradient(circle 700px at 80% 75%, rgba(26,32,24,.4) 0%, transparent 65%),
    linear-gradient(180deg,#0a0d0a 0%,#070907 40%,#090c09 70%,#050605 100%);
  background-attachment: fixed;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 100;
  opacity: .045;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
}

body::after {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 99;
  background: radial-gradient(ellipse at center,transparent 40%,rgba(5,7,5,.65) 75%,rgba(2,3,2,.94) 100%);
}

.fog-layer {
  position: fixed;
  inset: -100px;
  pointer-events: none;
  z-index: 1;
  background:
    radial-gradient(circle at 30% 20%,rgba(42,54,40,.09) 0%,transparent 50%),
    radial-gradient(circle at 80% 70%,rgba(30,42,30,.08) 0%,transparent 45%);
  animation: fogDrift 38s ease-in-out infinite alternate;
}

@keyframes fogDrift {
  0% { transform:translateY(0) scale(1); opacity:.7; }
  50% { transform:translateY(-40px) translateX(25px) scale(1.05); opacity:.95; }
  100% { transform:translateY(20px) translateX(-30px) scale(1); opacity:.7; }
}

h1,h2,h3,nav,.kicker,.num,.btn-medieval {
  font-family:"Cinzel",Georgia,serif;
  letter-spacing:.04em;
}

.ornament {
  display:block;
  text-align:center;
  font-family:"Cinzel Decorative",serif;
  color:var(--olive-accent);
  opacity:.75;
  user-select:none;
  margin:18px 0;
  font-size:19px;
  letter-spacing:.35em;
}

header {
  min-height:94vh;
  display:grid;
  place-items:center;
  text-align:center;
  padding:80px 24px 60px;
  position:relative;
  overflow:hidden;
  border-bottom:1px solid var(--line-tomb);
}

.hero-background-art {
  position:absolute;
  inset:0;
  z-index:0;
  opacity:.17;
  background-image:url('assets/plague-woodcut.jpg');
  background-size:cover;
  background-position:center 30%;
  filter:grayscale(85%) contrast(140%) brightness(.65) sepia(25%);
  mask-image:radial-gradient(ellipse at 50% 50%,black 25%,transparent 75%);
  -webkit-mask-image:radial-gradient(ellipse at 50% 50%,black 25%,transparent 75%);
}

.hero-glow {
  position:absolute;
  top:35%;
  left:50%;
  transform:translate(-50%,-50%);
  width:650px;
  height:480px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(74,91,66,.22) 0%,rgba(35,46,33,.1) 45%,transparent 75%);
  filter:blur(60px);
  pointer-events:none;
  z-index:1;
}

.cover {
  position:relative;
  z-index:2;
  max-width:900px;
  padding:0 10px;
}

h1 {
  font-size:clamp(42px,8.5vw,86px);
  font-weight:700;
  line-height:1.08;
  margin:12px 0 16px;
  color:var(--parchment-bright);
  text-shadow:0 2px 4px rgba(0,0,0,.9),0 8px 30px rgba(0,0,0,.8),0 0 50px rgba(73,90,67,.2);
  letter-spacing:.03em;
}

h1 span {
  display:inline-block;
  color:#ede4d2;
  border-bottom:1px solid rgba(135,124,104,.35);
  padding-bottom:4px;
}

.subtitle {
  color:var(--parchment-dim);
  font-size:clamp(20px,3.2vw,25px);
  font-style:italic;
  max-width:680px;
  margin:0 auto 32px;
  letter-spacing:.02em;
  text-shadow:0 2px 10px rgba(0,0,0,.8);
}

.btn-medieval {
  display:inline-block;
  position:relative;
  text-decoration:none;
  font-size:13.5px;
  font-weight:600;
  letter-spacing:.24em;
  text-transform:uppercase;
  color:var(--parchment-bright);
  background:linear-gradient(180deg,#242f22 0%,#171f16 100%);
  border:1px solid #4a5c44;
  padding:14px 32px;
  border-radius:2px;
  cursor:pointer;
  box-shadow:0 4px 18px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.08);
  transition:all .25s ease;
}

.btn-medieval:hover {
  background:linear-gradient(180deg,#2f3e2c 0%,#1e291c 100%);
  border-color:#6b8362;
  color:#fff;
  transform:translateY(-2px);
}

nav {
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(10,13,10,.94);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line-tomb);
  display:flex;
  gap:8px;
  justify-content:center;
  flex-wrap:wrap;
  padding:12px 16px;
  box-shadow:0 8px 30px rgba(0,0,0,.6);
}

nav a {
  color:var(--parchment-dim);
  text-decoration:none;
  padding:6px 14px;
  font-size:12.5px;
  letter-spacing:.18em;
  text-transform:uppercase;
  transition:all .2s ease;
  border-bottom:1px solid transparent;
}

nav a:hover {
  color:var(--parchment-bright);
  border-bottom-color:var(--olive-accent);
  background:rgba(30,38,29,.35);
}

main {
  position:relative;
  z-index:2;
  max-width:960px;
  margin:auto;
  padding:20px 24px 120px;
}

section {
  padding:85px 0 65px;
  border-bottom:1px solid var(--line-tomb);
  position:relative;
}

h2 {
  font-size:clamp(28px,4.2vw,38px);
  font-weight:600;
  color:var(--parchment-bright);
  margin-top:0;
  margin-bottom:24px;
  display:flex;
  align-items:center;
  gap:16px;
  text-shadow:0 2px 8px rgba(0,0,0,.7);
}

h2::after {
  content:"";
  flex:1;
  height:1px;
  background:linear-gradient(90deg,var(--line-highlight) 0%,transparent 95%);
}

h3 {
  font-size:21px;
  font-weight:600;
  color:#d1c5ae;
  margin:0 0 10px;
  letter-spacing:.05em;
}

p {
  margin:0 0 1.5em;
  color:var(--parchment-base);
}

.lead {
  font-size:23px;
  line-height:1.65;
  color:var(--parchment-bright);
  border-left:3px solid var(--olive-accent);
  padding-left:20px;
  margin-bottom:28px;
}

.woodcut-banner {
  margin:40px 0 30px;
  border:1px solid var(--line-tomb);
  border-radius:3px;
  overflow:hidden;
  background:var(--charcoal-900);
  box-shadow:var(--shadow-fog);
  display:grid;
  grid-template-columns:280px 1fr;
  align-items:center;
}

.woodcut-img-wrapper {
  position:relative;
  height:100%;
  min-height:220px;
  overflow:hidden;
  border-right:1px solid var(--line-tomb);
}

.woodcut-img-wrapper img {
  width:100%;
  height:100%;
  object-fit:cover;
  filter:grayscale(70%) contrast(125%) sepia(25%);
  transition:transform .6s ease,filter .6s ease;
  display:block;
}

.woodcut-banner:hover .woodcut-img-wrapper img {
  transform:scale(1.04);
  filter:grayscale(40%) contrast(120%) sepia(15%);
}

.woodcut-caption {
  padding:26px 30px;
  font-size:17.5px;
  line-height:1.65;
  color:var(--parchment-base);
}

.caption-title {
  font-family:"Cinzel",serif;
  font-size:14px;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:var(--parchment-dim);
  margin-bottom:10px;
  display:block;
}

.grid-container {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:16px;
  margin-top:25px;
}

.card {
  position:relative;
  border:1px solid var(--line-tomb);
  background:linear-gradient(155deg,rgba(22,28,21,.85) 0%,rgba(13,16,13,.95) 100%);
  padding:24px;
  border-radius:3px;
  transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease;
  box-shadow:0 4px 18px rgba(0,0,0,.5);
}

.card::before {
  content:"";
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:2px;
  background:linear-gradient(90deg,transparent 0%,var(--olive-accent) 50%,transparent 100%);
  opacity:.35;
}

.card:hover {
  transform:translateY(-4px);
  border-color:var(--olive-accent);
  box-shadow:0 12px 30px rgba(0,0,0,.7),0 0 15px rgba(56,73,52,.25);
}

.card p {
  margin:0;
  font-size:18px;
  color:var(--parchment-base);
  line-height:1.6;
}

.chapter-card {
  cursor:pointer;
  min-height:120px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.chapter-card h3 {
  margin:0;
  font-size:19px;
  line-height:1.4;
}

.chapter-card::after {
  content:"Oxu  →";
  position:absolute;
  right:18px;
  bottom:12px;
  font-family:"Cinzel",serif;
  font-size:10px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--olive-accent);
  opacity:.75;
}

.character-role {
  display:inline-block;
  font-size:11px;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:#9c8e76;
  margin-bottom:8px;
  font-family:"Cinzel",serif;
}

.num {
  display:inline-block;
  color:#8c9c84;
  font-size:11.5px;
  letter-spacing:.24em;
  margin-bottom:8px;
  font-weight:600;
  border-bottom:1px solid rgba(140,156,132,.25);
  padding-bottom:2px;
}

.quote {
  position:relative;
  background:linear-gradient(135deg,rgba(20,26,19,.75) 0%,rgba(13,17,13,.85) 100%);
  border:1px solid var(--line-tomb);
  border-left:4px solid var(--blood-ember);
  padding:24px 30px;
  color:var(--parchment-bright);
  font-style:italic;
  font-size:21px;
  margin:35px 0;
  box-shadow:0 8px 30px rgba(0,0,0,.5);
  border-radius:2px;
}

.contact-badge {
  display:inline-flex;
  align-items:center;
  gap:10px;
  margin-top:14px;
  padding:8px 18px;
  background:rgba(22,28,21,.6);
  border:1px solid var(--line-tomb);
  border-radius:2px;
  color:var(--parchment-bright);
  font-family:"Cinzel",serif;
  font-size:13.5px;
  letter-spacing:.08em;
  text-decoration:none;
}

footer {
  text-align:center;
  color:var(--parchment-faded);
  padding:60px 20px 40px;
  font-size:15px;
  font-family:"Cinzel",serif;
  letter-spacing:.12em;
  border-top:1px solid var(--line-tomb);
  background:#050605;
  position:relative;
  z-index:2;
}

/* FƏSİL OXUYUCU */

#chapter-reader {
  display:none;
  position:fixed;
  inset:0;
  z-index:1000;
  background:rgba(6,8,6,.98);
  overflow-y:auto;
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}

.reader-inner {
  max-width:820px;
  margin:auto;
  padding:75px 28px 110px;
}

.reader-top {
  text-align:center;
  margin-bottom:50px;
}

.reader-number {
  display:block;
  font-family:"Cinzel",serif;
  font-size: 12px;
letter-spacing: 0.28em;
color: #8c9c84;
